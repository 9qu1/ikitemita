<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>イキテミタ｜ボタンひとつで、だれかの一生をのぞく</title>
<meta name="description" content="ボタンを押すと、世界のどこかの ひと・どうぶつ・むし にうまれて、その一生を神さまの目線でながめるだけ。最大100倍速、100の一生を同時に。登録なし・無料。">
<meta property="og:title" content="イキテミタ｜ボタンひとつで、だれかの一生をのぞく">
<meta property="og:description" content="ひとにも、ネコにも、アリにも。世界のどこかにうまれた一生を、神さまの目線でながめるだけ。100の一生を同時に、最大100倍速。">
<meta property="og:type" content="website">
<meta property="og:image" content="https://9qu1.com/ikitemita/og.png">
<meta property="og:url" content="https://9qu1.com/ikitemita/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#B9E6F7">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css?v=1.0.3">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-1T31EDBJBY"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1T31EDBJBY');</script>
</head>
<body data-screen="home">
<main id="app">

  <!-- ホーム -->
  <section id="home" class="screen is-on">
    <div class="sky-wrap">
      <div class="sky" id="skyScene">
        <img class="logo" src="img/logo.webp" alt="イキテミタ" width="760" height="300">
        <p class="tagline">ボタンひとつで、どこかの だれかに うまれて<br>その一生を そっと ながめる</p>
        <div class="phone" id="phone">
          <div class="phone-screen" id="phoneScreen">
            <div class="ps-islands" aria-hidden="true">
              <img src="img/hab/forest.webp" alt="" class="isl i1">
              <img src="img/hab/seashore.webp" alt="" class="isl i2">
              <img src="img/hab/garden.webp" alt="" class="isl i3">
            </div>
            <button type="button" id="birthBtn" class="btn-birth">うまれる</button>
            <p class="ps-hint" id="psHint">どこかの だれかに うまれます</p>
          </div>
        </div>
      </div>
      <div class="sparks" id="sparks" aria-hidden="true"></div>
    </div>

    <div class="panels">
      <section class="counter" id="counter" hidden aria-live="polite">
        <p class="cnt-label"><img src="img/icons/birth.webp" alt="" width="20" height="20">みんなで うまれた いのち</p>
        <p class="cnt-num"><b id="cntLives">0</b><span>こ</span></p>
        <p class="cnt-sub" id="cntSub"></p>
      </section>
      <section class="panel">
        <h2><img src="img/icons/sun.webp" alt="" width="22" height="22">スピード<small>（人生の進み方）</small></h2>
        <div class="chips row" id="speedChips"></div>
      </section>
      <section class="panel">
        <h2><img src="img/icons/friends.webp" alt="" width="22" height="22">同時に いきる数</h2>
        <div class="chips row" id="countChips"></div>
      </section>
      <section class="panel">
        <h2><img src="img/icons/sprout.webp" alt="" width="22" height="22">うまれさき</h2>
        <div class="chips" id="filterChips"></div>
        <p class="note" id="filterNote"></p>
      </section>
      <section class="panel history" id="historyPanel" hidden>
        <h2><img src="img/icons/feather.webp" alt="" width="22" height="22">これまでに いきてみた いのち <span class="total" id="totalCount"></span></h2>
        <ul class="hist-list" id="historyList"></ul>
      </section>
      <div id="prHome"></div>
      <footer class="foot">
        <a href="about.html">このアプリについて</a>
        <a href="https://9qu1.com/">くぁくぁのつくったもの</a>
        <button type="button" id="soundBtn" class="foot-btn">おと：なし</button>
      </footer>
    </div>
  </section>

  <!-- 地球儀（どこにうまれるか） -->
  <div id="warp" class="warp" hidden>
    <p class="warp-sub" id="warpSub"></p>
    <canvas id="globe" aria-hidden="true"></canvas>
    <p class="warp-main" id="warpMain" aria-live="polite"></p>
    <p class="warp-skip">タップで とばせます</p>
  </div>

  <!-- 一生を見る -->
  <section id="run" class="screen">
    <header class="run-top">
      <button type="button" class="icon-btn" id="runClose" aria-label="やめて ホームへ">✕</button>
      <div class="run-status" id="runStatus" aria-live="off"></div>
      <button type="button" class="icon-btn" id="runPause" aria-label="一時停止">⏸</button>
      <button type="button" class="small-btn" id="runSkip">さいごまで</button>
    </header>
    <div class="run-body">
      <div class="run-stage">
        <canvas id="world" aria-label="一生のようす"></canvas>
        <div class="age-cap" id="ageCap"></div>
        <button type="button" class="btn-primary run-done" id="runDone" hidden>まとめを見る</button>
      </div>
      <div class="run-side">
        <div class="chips mini" id="runSpeed" aria-label="スピード"></div>
        <div class="run-log">
          <h3 id="logTitle">この いのちの ものがたり</h3>
          <ol id="log" class="log"></ol>
        </div>
      </div>
    </div>
  </section>

  <!-- まとめ -->
  <section id="result" class="screen">
    <div class="res-wrap">
      <p class="res-note" id="resNote" hidden>データが新しくなったため、共有されたときとは ちがう一生に なっているかもしれません。</p>
      <div class="res-card-box"><img id="resCard" class="res-card loading" alt=""></div>
      <div class="res-actions">
        <button type="button" class="btn-primary" id="saveBtn" disabled><img src="img/icons/gift.webp" alt="" width="24" height="24">画像を保存</button>
        <button type="button" class="btn-secondary" id="againBtn">もういちど</button>
      </div>
      <div class="res-sub">
        <a class="link-btn" id="xShare" href="#">X でシェア</a>
        <button type="button" class="link-btn" id="copyBtn">リンクをコピー</button>
        <button type="button" class="link-btn" id="replayBtn">もう一度 ながめる</button>
        <button type="button" class="link-btn" id="homeBtn">ホームへ</button>
      </div>
      <p class="res-serial" id="resSerial" hidden></p>
      <div class="res-stats" id="resStats" hidden></div>
      <p class="res-fact" id="resFact" hidden></p>
      <section class="panel res-detail">
        <h2 id="resDetailTitle">ぜんぶの できごと</h2>
        <ol id="resList" class="log"></ol>
      </section>
      <div id="prResult"></div>
      <footer class="foot">
        <a href="about.html">このアプリについて</a>
        <a href="https://9qu1.com/">くぁくぁのつくったもの</a>
      </footer>
    </div>
  </section>

  <!-- 1つを大きく見る／カード -->
  <div id="focus" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="focusTitle">
      <div class="modal-head">
        <div class="modal-title" id="focusTitle"></div>
        <button type="button" class="icon-btn" id="focusClose" aria-label="とじる">✕</button>
      </div>
      <div class="focus-stage">
        <canvas id="focusCanvas"></canvas>
        <div class="age-cap small" id="focusAge"></div>
        <img id="focusCard" class="res-card" alt="" hidden>
      </div>
      <button type="button" class="btn-primary small" id="focusSave" hidden>このカードを保存</button>
      <ol id="focusLog" class="log"></ol>
    </div>
  </div>

  <div id="toast" class="toast" hidden role="status"></div>
</main>
<script type="module" src="js/app.js?v=1.0.3"></script>
</body>
</html>
